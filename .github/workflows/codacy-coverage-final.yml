---
# Closes the Codacy coverage upload for a commit. Each pytest workflow sends a partial
# report; this workflow runs after any of them finishes and calls "final" only when every
# one of them has completed for the same commit. A repository without the
# CODACY_PROJECT_TOKEN secret skips the whole job.
name: Codacy coverage final

on:
  workflow_run:
    workflows:
      - Testing platform auth
      - Testing BackupDatabase
      - Testing mysqlfuncts
      - Testing postgresqlfuncts
      - Testing sqlitefuncts
      - Miscellaneous platform tests
      - Testing testutils directory
      - Testing volttron-ctl
      - Testing platform web
    types: [completed]

permissions:
  actions: read

concurrency:
  group: codacy-final-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Close Codacy coverage when all pytest workflows are done
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED: 9
          REPORTER_VERSION: 14.1.3
          REPORTER_SHA256: 15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875
        run: |
          set -euo pipefail
          if [[ -z "$CODACY_PROJECT_TOKEN" ]]; then
            echo "CODACY_PROJECT_TOKEN is not available; skipping"
            exit 0
          fi

          # Latest run of each named workflow for this commit, counted once per workflow.
          names=(
            "Testing platform auth"
            "Testing BackupDatabase"
            "Testing mysqlfuncts"
            "Testing postgresqlfuncts"
            "Testing sqlitefuncts"
            "Miscellaneous platform tests"
            "Testing testutils directory"
            "Testing volttron-ctl"
            "Testing platform web"
          )
          runs=$(gh api --paginate "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            -q '.workflow_runs[] | [.name, .status] | @tsv')
          done_count=0
          for n in "${names[@]}"; do
            if grep -qxF "$(printf '%s\tcompleted' "$n")" <<<"$runs"; then
              done_count=$((done_count + 1))
            fi
          done
          if (( done_count != EXPECTED )); then
            echo "${done_count} of ${EXPECTED} pytest workflows completed for ${HEAD_SHA}; a later run will close it"
            exit 0
          fi

          reporter="$RUNNER_TEMP/codacy-coverage-reporter"
          curl -fsSL -o "$reporter" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${REPORTER_VERSION}/codacy-coverage-reporter-linux"
          echo "${REPORTER_SHA256}  ${reporter}" | sha256sum -c -
          chmod +x "$reporter"
          "$reporter" final --commit-uuid "$HEAD_SHA"
