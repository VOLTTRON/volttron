---
exclude_paths:
  # Frozen; nothing under deprecated/ is edited or reviewed.
  - "deprecated/**"
  # Documentation source, not code.
  - "docs/**"
  # Sample code meant for users to copy, not code this repo ships or runs.
  - "examples/**"
  # Webpack-generated VolttronCentral bundle; the pattern covers future hashes too.
  - "services/core/VolttronCentral/volttroncentral/webroot/vc/css/app-*.css"
  - "services/core/VolttronCentral/volttroncentral/webroot/vc/js/app-*.js"
  # Vendored, minified third-party JavaScript and CSS.
  - "**/*.min.js"
  - "**/*.min.css"

include_paths:
  # ListenerAgent is installed by instance_setup.py and exercised by tests;
  # it is example code that also runs, unlike the rest of examples/.
  - "examples/ListenerAgent/**"
  # conf.py runs in the docs build and calls subprocess.
  - "docs/source/conf.py"

engines:
  pylintpython3:
    exclude_paths: &test_exclude_paths
      # Style and documentation checks do not apply to test code.
      - "**/tests/**"
      # Add the root tests/ directory explicitly: the docs do not state
      # whether "**/x" reaches a zero-depth match, so do not rely on it.
      - "tests/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"
  prospector:
    # Same style exclusion as Pylint; Bandit still analyzes this code.
    exclude_paths: *test_exclude_paths
  tsqllint:
    exclude_paths:
      # MySQL and SQLite schema DDL, not T-SQL.
      - "services/core/SQLHistorian/*.sql"
